name: Deploy Site → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'preview/index.html'
      - 'index.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel queued runs but not in-progress
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build docs/ artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # docs/ is a zero-build static SPA — no npm install needed.
      # Assemble the full artifact: docs/ + preview index + root index.md
      - name: Prepare artifact
        run: |
          set -e

          # Copy root index.md into docs/ for completeness
          cp index.md docs/index.md

          # Include preview page index at docs/preview/
          mkdir -p docs/preview
          if [ -f preview/index.html ]; then
            cp preview/index.html docs/preview/index.html
            echo "✅ Included preview/index.html"
          else
            echo '<meta http-equiv="refresh" content="0;url=https://github.com/wikialisalabs/wikialisalabs/tree/main/preview/pages">' > docs/preview/index.html
            echo "⚠️  preview/index.html not found — using redirect fallback"
          fi

          # Copy SVG icon sprite if not already present in docs/
          if [ -f docs/public/sprites/icons.svg ]; then
            echo "✅ Icon sprite already present in docs/public/sprites/"
          elif [ -f tmp_design/public/sprites/icons.svg ]; then
            mkdir -p docs/public/sprites
            cp tmp_design/public/sprites/icons.svg docs/public/sprites/icons.svg
            echo "✅ Copied icons.svg from tmp_design/"
          fi

          # Ensure the root 404 fallback exists for GitHub Pages SPA
          if [ ! -f docs/404.html ]; then
            cat > docs/404.html << 'HTML'
          <!DOCTYPE html>
          <html><head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=./index.html">
            <script>
              const p = window.location.pathname.replace(/^\/wikialisalabs/, '');
              sessionStorage.redirect = p;
              window.location = '/wikialisalabs/';
            </script>
            <title>Redirecting…</title>
          </head><body>Redirecting…</body></html>
          HTML
            echo "✅ Generated docs/404.html SPA fallback"
          fi

          echo ""
          echo "Artifact contents:"
          find docs -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
