name: Deploy Site → GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'index.md'
      - '.github/workflows/deploy-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build web/ artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Prepare artifact
        run: |
          set -e

          # Copy root index.md into web/ for reference
          cp index.md web/index.md

          # Ensure 404.html exists for SPA routing
          if [ ! -f web/404.html ]; then
            cat > web/404.html << 'HTML'
          <!DOCTYPE html>
          <html><head>
            <meta charset="UTF-8">
            <meta http-equiv="refresh" content="0;url=./index.html">
            <script>
              const p = window.location.pathname.replace(/^\/wikialisalabs/, '');
              sessionStorage.redirect = p;
              window.location = '/wikialisalabs/';
            </script>
            <title>Redirecting…</title>
          </head><body>Redirecting…</body></html>
          HTML
            echo "✅ Generated web/404.html SPA fallback"
          fi

          echo ""
          echo "Artifact contents (top-level):"
          find web -maxdepth 2 -type f | sort

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
