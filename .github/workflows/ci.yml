name: CI — Validate & Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-web:
    name: Validate web/ content
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check all .md files have frontmatter
        run: |
          failed=0
          for f in web/src/content/*.md; do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "❌ Missing frontmatter: $f"
              failed=$((failed+1))
            else
              echo "✅ $f"
            fi
          done
          if [ $failed -gt 0 ]; then
            echo "$failed file(s) missing frontmatter"
            exit 1
          fi

      - name: Check JS modules export render()
        run: |
          failed=0
          for f in web/src/pages/*.js; do
            if ! grep -q "export.*function render\|export async function render" "$f"; then
              echo "❌ Missing render() export: $f"
              failed=$((failed+1))
            else
              echo "✅ $(basename $f)"
            fi
          done
          if [ $failed -gt 0 ]; then exit 1; fi

      - name: Check router has all routes
        run: |
          for route in overview tokens icons components tlp guidelines changelog zones; do
            if grep -q "$route" web/src/router/index.js; then
              echo "✅ route /$route"
            else
              echo "❌ route /$route missing from router"
              exit 1
            fi
          done

      - name: Check lib exports
        run: |
          for fn in parseFrontmatter renderMd loadMd injectMdStyles; do
            if grep -q "export.*$fn" web/src/lib/md.js; then
              echo "✅ md.js exports $fn"
            else
              echo "❌ md.js missing export: $fn"
              exit 1
            fi
          done
          for fn in ContribCard VoteBar SubmitForm CommentThread StatusBoard injectContribStyles mountAll; do
            if grep -q "export.*$fn\|export function $fn\|export async function $fn" web/src/lib/contrib.js; then
              echo "✅ contrib.js exports $fn"
            else
              echo "❌ contrib.js missing export: $fn"
              exit 1
            fi
          done

      - name: Check token CSS files
        run: |
          for f in web/src/style/tokens-primitive.css web/src/style/tokens-semantic.css web/src/style/tokens-component.css; do
            if [ -f "$f" ]; then
              echo "✅ $f exists"
            else
              echo "❌ Missing token CSS: $f"
              exit 1
            fi
          done

      - name: Check required web/ structure
        run: |
          required=(
            "web/index.html"
            "web/landing.html"
            "web/404.html"
            "web/public/sprites/icons.svg"
            "web/preview/index.html"
            "web/design-system/tokens/primitive.css"
            "web/design-system/tokens/semantic.css"
            "web/design-system/tokens/component.css"
          )
          failed=0
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ Missing: $f"
              failed=$((failed+1))
            fi
          done
          if [ "$failed" -gt 0 ]; then exit 1; fi

      - name: Check no broken internal links in index.md
        run: |
          missing=0
          while IFS= read -r link; do
            path="${link#./}"
            [[ "$path" == */ ]] && continue
            [[ "$path" == http* ]] && continue
            if [ ! -f "$GITHUB_WORKSPACE/$path" ]; then
              echo "⚠️  Link target not found: $path"
              missing=$((missing+1))
            fi
          done < <(grep -oP '\(\.\/[^)]+\)' index.md | tr -d '()')
          if [ "$missing" -gt 0 ]; then
            echo "$missing broken link(s) found"
            exit 1
          fi
          echo "✅ All internal links resolve"

      - name: Summary
        run: |
          echo "### ✅ CI passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| MD frontmatter | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| JS render() exports | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Router routes | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| lib exports | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| Token CSS files | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "| web/ structure | ✅ |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**web/ files:** $(find web -type f | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Content pages:** $(find web/src/content -name '*.md' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**Preview pages:** $(find web/preview/pages -name '*.astro' | wc -l)" >> $GITHUB_STEP_SUMMARY
          echo "**DS components:** $(find web/design-system/src/components -name '*.tsx' 2>/dev/null | wc -l)" >> $GITHUB_STEP_SUMMARY
