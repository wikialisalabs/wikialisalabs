name: Build & Validate Web

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/build-docs.yml'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-web:
    name: Validate web/ structure
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check required files exist
        run: |
          set -e
          required=(
            "web/index.html"
            "web/landing.html"
            "web/404.html"
            "web/src/router/index.js"
            "web/src/style/shell.css"
            "web/src/style/pages.css"
            "web/src/style/tokens-primitive.css"
            "web/src/style/tokens-semantic.css"
            "web/src/style/tokens-component.css"
            "web/src/content/overview.md"
            "web/src/content/tokens.md"
            "web/src/content/icons.md"
            "web/src/content/components.md"
            "web/src/content/tlp.md"
            "web/src/content/changelog.md"
            "web/src/pages/tlp.js"
            "web/src/pages/guidelines.js"
            "web/src/pages/changelog.js"
            "web/public/sprites/icons.svg"
            "web/preview/index.html"
            "web/design-system/tokens/primitive.css"
            "web/design-system/tokens/semantic.css"
            "web/design-system/tokens/component.css"
            "web/design-system/package.json"
          )
          failed=0
          for f in "${required[@]}"; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ Missing: $f"
              failed=$((failed+1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "$failed required file(s) missing"
            exit 1
          fi

      - name: Check all content .md files have frontmatter
        run: |
          failed=0
          for f in web/src/content/*.md; do
            if ! head -1 "$f" | grep -q "^---"; then
              echo "❌ Missing frontmatter: $f"
              failed=$((failed+1))
            else
              echo "✅ $f"
            fi
          done
          if [ $failed -gt 0 ]; then exit 1; fi

      - name: Check JS pages export render()
        run: |
          failed=0
          for f in web/src/pages/*.js; do
            if ! grep -q "export.*function render\|export async function render" "$f"; then
              echo "❌ Missing render() export: $f"
              failed=$((failed+1))
            else
              echo "✅ $(basename $f)"
            fi
          done
          if [ $failed -gt 0 ]; then exit 1; fi

      - name: Check router contains all required routes
        run: |
          router="web/src/router/index.js"
          required_routes=("/" "/tokens" "/icons" "/components" "/tlp" "/guidelines" "/changelog" "/zones")
          failed=0
          for route in "${required_routes[@]}"; do
            if grep -qF "'${route}'" "$router" || grep -qF "\"${route}\"" "$router"; then
              echo "✅ route ${route}"
            else
              echo "❌ route ${route} missing from router"
              failed=$((failed+1))
            fi
          done
          if [ "$failed" -gt 0 ]; then exit 1; fi

      - name: Check token CSS files have :root block
        run: |
          for f in web/src/style/tokens-primitive.css web/src/style/tokens-semantic.css web/src/style/tokens-component.css; do
            if grep -q ":root" "$f"; then
              echo "✅ $f has :root"
            else
              echo "❌ $f missing :root block"
              exit 1
            fi
          done

      - name: Summary
        run: |
          md_count=$(find web/src/content -name "*.md" | wc -l)
          page_count=$(find web/src/pages -name "*.js" | wc -l)
          astro_count=$(find web/preview/pages -name "*.astro" | wc -l)
          ds_count=$(find web/design-system/src/components -name "*.tsx" 2>/dev/null | wc -l)
          echo "### ✅ Build & Validate Web passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Item | Count |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Content .md files | $md_count |" >> $GITHUB_STEP_SUMMARY
          echo "| Page modules | $page_count |" >> $GITHUB_STEP_SUMMARY
          echo "| Preview .astro pages | $astro_count |" >> $GITHUB_STEP_SUMMARY
          echo "| Design System components | $ds_count |" >> $GITHUB_STEP_SUMMARY
          echo "| Total web/ files | $(find web -type f | wc -l) |" >> $GITHUB_STEP_SUMMARY
