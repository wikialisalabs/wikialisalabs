[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/src/**"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/public/**"
  [headers.values]
    Cache-Control = "public, max-age=604800, immutable"

[build]
  publish = "."
  command = ""

# SPA fallback — rewrite tất cả route không phải file vào index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Language = ["en", "vi"]}

[[redirects]]
  from = "/preview"
  to = "/preview/"
  status = 301

[[redirects]]
  from = "/design-system"
  to = "/design-system/"
  status = 301
