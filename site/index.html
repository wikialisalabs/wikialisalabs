  <!-- Work Sans -->
  <link href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

      </a>
    </div>

      <div class="sidebar-group-label">Foundation</div>
      <a class="sidebar-link" href="#/tokens" data-route="/tokens">

          <path d="M15.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0"/>
        </svg>
        Tokens
        <span class="sidebar-badge">3 layers</span>

      <a class="sidebar-link" href="#/icons" data-route="/icons">

        </svg>

        <span class="sidebar-badge">5130+</span>
      </a>
    </div>

    <div class="sidebar-group">
      <div class="sidebar-group-label">Components</div>
      <a class="sidebar-link" href="#/components" data-route="/components">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 4h4a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1"/>
          <path d="M5 16h4a1 1 0 0 1 1 1v2a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1"/>

        </svg>

        <span class="sidebar-badge">6</span>
      </a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/button" data-route="/components/button">Button</a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/badge" data-route="/components/badge">Badge</a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/input" data-route="/components/input">Input</a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/toggle" data-route="/components/toggle">Toggle</a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/card" data-route="/components/card">Card</a>
      <a class="sidebar-link sidebar-link-sub" href="#/components/navbar" data-route="/components/navbar">Navbar</a>

    <div class="sidebar-group">
      <div class="sidebar-group-label">Resources</div>
      <a class="sidebar-link" href="#/zones" data-route="/zones">

          <path d="M12 12l8-4.5"/><path d="M12 12l0 9"/><path d="M12 12l-8-4.5"/>

      </a>
      <a class="sidebar-link" href="landing.html" target="_blank">

          <path d="M9 12h6"/><path d="M12 9v6"/>

      </a>

        <span class="sidebar-badge">Astro</span>

  <div class="sidebar-footer">
    <a class="sidebar-ext-link" href="https://wikialisalabs.axq" target="_blank">

<!-- ── MAIN ── -->
<div class="layout">

  <!-- TOPBAR -->
  <header class="topbar">
    <button class="topbar-menu-btn" id="menuBtn" aria-label="Toggle sidebar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 6l16 0"/><path d="M4 12l16 0"/><path d="M4 18l16 0"/>
      </svg>
    </button>

    <div class="topbar-breadcrumb" id="topbarBreadcrumb">
      <span class="bc-root">Wikialisalabs</span>
      <span class="bc-sep">/</span>
      <span class="bc-current" id="bcCurrent">Overview</span>
    </div>

    <div class="topbar-actions">
      <div class="topbar-search" id="topbarSearch" style="display:none">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="16" height="16">
          <path d="M10 10m-7 0a7 7 0 1 0 14 0a7 7 0 1 0-14 0"/><path d="M21 21l-6-6"/>
        </svg>
        <input type="text" id="globalSearch" placeholder="Search icons…" autocomplete="off" />
      </div>
      <a class="topbar-gh" href="https://github.com/axioledger" target="_blank" aria-label="GitHub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" width="18" height="18">
          <path d="M9 19c-4.3 1.4-4.3-2.5-6-3m12 5v-3.5c0-1 .1-1.4-.5-2c2.8-.3 5.5-1.4 5.5-6a4.6 4.6 0 0 0-1.3-3.2a4.2 4.2 0 0 0-.1-3.2s-1.1-.3-3.5 1.3a12.3 12.3 0 0 0-6.2 0c-2.4-1.6-3.5-1.3-3.5-1.3a4.2 4.2 0 0 0-.1 3.2a4.6 4.6 0 0 0-1.3 3.2c0 4.6 2.7 5.7 5.5 6c-.6.6-.6 1.2-.5 2v3.5"/>
        </svg>
      </a>
    </div>
  </header>

  <!-- PAGE CONTENT -->
  <main class="page-content" id="app">
    <div class="page-loading">
      <div class="loading-spinner"></div>
      <span>Loading…</span>
    </div>
  </main>

</div>

<!-- ── COPY TOAST ── -->
<div class="copy-toast" id="copyToast">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" width="14" height="14">
    <path d="M5 12l5 5l10-10"/>
  </svg>
  Copied!
</div>

<!-- ── SCRIPTS ── -->
<script type="module" src="src/router/index.js"></script>

</body>
</html>
